<head>

<style>
html{color-scheme:light;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<title>剑桥语法中译英</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one calm column, exam-screen feel — unit map on home, single sentence card when training */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#151b26; --muted:#5d6676; --line:#dde2ea;
  --accent:#2c49c9; --accent-soft:#e6ebfb; --ok:#1d7f48; --ok-soft:#e2f3e9;
  --mid:#a76a0e; --mid-soft:#fbf0dc; --bad:#bf3329; --bad-soft:#fbe6e4;
  --cell-locked:#e9ecf1;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --ink:#e7eaf0; --muted:#98a1b1; --line:#2c3440;
  --accent:#8ea3ff; --accent-soft:#232c4a; --ok:#5fc98b; --ok-soft:#173326;
  --mid:#e3ad55; --mid-soft:#3a2c14; --bad:#f07a6f; --bad-soft:#3d1d1a; --cell-locked:#20262f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --ink:#e7eaf0; --muted:#98a1b1; --line:#2c3440;
  --accent:#8ea3ff; --accent-soft:#232c4a; --ok:#5fc98b; --ok-soft:#173326;
  --mid:#e3ad55; --mid-soft:#3a2c14; --bad:#f07a6f; --bad-soft:#3d1d1a; --cell-locked:#20262f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px}
button:focus-visible,textarea:focus-visible,.cell:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:default}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.top h1{font-size:24px;font-weight:700}
.top .sub{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:20px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* next card */
.next{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.next .unit-no{font-family:var(--f-mono);color:var(--accent);font-size:14px}
.next h2{font-size:20px}
.next .tip{font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* map */
.map{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:6px}
.sec .label{display:flex;justify-content:space-between}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.cell{font-family:var(--f-mono);font-size:13px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;min-height:0;position:relative}
.cell.locked{background:var(--cell-locked);color:var(--muted);border-style:dashed}
.cell.tried{background:var(--mid-soft);border-color:var(--mid);color:var(--ink)}
.cell.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.cell.cur{border:2px solid var(--accent);color:var(--accent);font-weight:700;background:var(--accent-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid var(--line)}

.tools{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.tools button{font-size:14px;min-height:40px;padding:8px 12px}

/* practice */
.bar{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0;transition:width .25s}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.tag{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.chip.review{background:var(--mid-soft);color:var(--mid)}
.zh{font-size:24px;font-weight:500;line-height:1.5}
.hint{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{width:100%;font-family:var(--f-en);font-size:21px;line-height:1.45;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;resize:vertical;min-height:96px}
.kbd{font-size:12px;color:var(--muted)}

.fb{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.verdict{font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)} .verdict.check{color:var(--accent)}
.lines{display:flex;flex-direction:column;gap:8px}
.ln{display:grid;grid-template-columns:3.2em 1fr;gap:8px;align-items:baseline}
.ln .k{font-size:12px;color:var(--muted)}
.en{font-family:var(--f-en);font-size:19px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.en .miss{background:var(--ok-soft);color:var(--ok);border-bottom:2px solid var(--ok);border-radius:3px;padding:0 2px}
.en .extra{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;border-radius:3px;padding:0 2px}
.alts{font-size:14px;color:var(--muted)}
.alts .en{font-size:16px}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{font-weight:600}
.grade .g1{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.grade .g2{border-color:var(--mid);color:var(--mid);background:var(--mid-soft)}
.grade .g0{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}

/* summary */
.score{font-family:var(--f-mono);font-size:44px;line-height:1}
.res{display:flex;flex-direction:column;gap:0}
.res-item{display:flex;flex-direction:column;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.res-item .zhs{font-size:15px}
.res-item .en{font-size:16px}
.pill{font-size:12px;border-radius:999px;padding:1px 9px;font-weight:600}
.pill.g1{background:var(--ok-soft);color:var(--ok)} .pill.g2{background:var(--mid-soft);color:var(--mid)} .pill.g0{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:12px;padding:14px 16px;font-weight:500}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.mid{background:var(--mid-soft);color:var(--mid)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.sheet .panel{background:var(--surface);width:100%;max-width:760px;max-height:86vh;border-radius:16px 16px 0 0;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet textarea{font-family:var(--f-mono);font-size:16px;min-height:240px;flex:1}
.sheet.top{align-items:flex-start;padding-top:max(32px,env(safe-area-inset-top,0px))}
.sheet.top .panel{border-radius:16px}
.fb:focus{outline:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.acct{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.acct .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.acct button{min-height:36px;padding:6px 12px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.busy{background:var(--mid)} .dot.err{background:var(--bad)}
.fld{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.fld input{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.msg{font-size:14px;color:var(--bad)} .msg.info{color:var(--ok)}
@media (max-width:480px){.zh{font-size:21px}textarea{font-size:19px}.grade{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.progress div{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" hidden>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h3 id="sheet-title">导出</h3><button class="ghost" id="sheet-close">关闭</button></div>
    <p class="muted" id="sheet-desc" style="margin:0;font-size:14px"></p>
    <textarea id="sheet-text" spellcheck="false"></textarea>
    <div class="row"><button class="primary" id="sheet-copy">复制</button><button id="sheet-apply" hidden>恢复进度</button></div>
  </div>
</div>
<div class="sheet top" id="login" hidden>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h3>登录同步进度</h3><button class="ghost" id="lg-close">关闭</button></div>
    <p class="muted" style="margin:0;font-size:14px">用邮箱注册一个账号。登录后练习进度会自动保存到云端，在任何设备上登录都能接着练。本机已有的进度会在第一次登录时一起合并上传。</p>
    <label class="fld"><span>邮箱</span><input type="email" id="lg-email" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="fld"><span>密码（至少 6 位）</span><input type="password" id="lg-pass" autocomplete="current-password"></label>
    <label class="switch"><input type="checkbox" id="lg-show"> 显示密码</label>
    <div class="msg" id="lg-msg" hidden></div>
    <div class="row"><button class="primary" id="lg-in">登录</button><button id="lg-up">注册新账号</button><button class="ghost" id="lg-reset">忘记密码</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

<script>
// [unit, title, tip, [[中文, "英文参考|可接受的另一种说法"], ...]]
const U = [
[1,"am/is/are","主语 + am/is/are + 形容词/名词。I am, he/she/it is, we/you/they are；否定加 not。",[
["我很累，但我不饿。","I'm tired, but I'm not hungry."],
["我哥哥怕狗。","My brother is afraid of dogs."],
["今天天气晴朗，但不暖和。","It's sunny today, but it isn't warm.|It's sunny today, but it's not warm."],
["那些人不是英国人，他们是澳大利亚人。","Those people aren't English. They're Australian.|Those people aren't British. They're Australian."],
["你的钥匙在桌子上。","Your keys are on the table.|Your key is on the table."],
["现在十点了，你又迟到了。","It's ten o'clock. You're late again."]]],
[2,"am/is/are（疑问句）","疑问句把 am/is/are 放到主语前：Is your mother at home? 特殊疑问词放最前。",[
["你妈妈在家吗？","Is your mother at home?|Is your mother home?"],
["你从哪里来？","Where are you from?|Where do you come from?"],
["你的车是什么颜色的？","What colour is your car?"],
["这些明信片多少钱？","How much are these postcards?"],
["你为什么迟到？","Why are you late?"],
["你饿吗？——不饿，但我渴。","Are you hungry? — No, I'm not, but I'm thirsty."]]],
[3,"I am doing（现在进行时）","am/is/are + -ing：说话这一刻正在发生的事。",[
["请安静，我在工作。","Please be quiet. I'm working."],
["看！正在下雨。","Look! It's raining."],
["孩子们正在公园里踢足球。","The children are playing football in the park."],
["她戴着一顶帽子。","She's wearing a hat."],
["你可以把电视关掉，我没在看。","You can turn off the television. I'm not watching it.|You can turn the television off. I'm not watching it."],
["我们现在正在吃晚饭。","We're having dinner now.|We're eating dinner now."]]],
[4,"are you doing?（现在进行时的疑问式）","疑问：Am/Is/Are + 主语 + -ing？Where are you going?",[
["你在做什么？","What are you doing?"],
["在下雨吗？","Is it raining?"],
["你为什么穿着外套？天不冷。","Why are you wearing a coat? It isn't cold.|Why are you wearing a coat? It's not cold."],
["你在等谁？","Who are you waiting for?"],
["保罗今天在上班吗？","Is Paul working today?"],
["你的朋友们要去哪儿？","Where are your friends going?"]]],
[5,"I do/work/like 等（一般现在时）","一般事实、习惯。he/she/it 后动词加 -s/-es；always/never/often 放在动词前。",[
["我哥哥在银行工作。","My brother works in a bank."],
["冬天这里经常下雨。","It often rains here in winter.|It rains a lot here in winter.|It rains a lot in winter here."],
["她总是很早到单位。","She always gets to work early.|She always arrives at work early."],
["我从来不吃早餐。","I never eat breakfast.|I never have breakfast."],
["地球绕着太阳转。","The earth goes round the sun.|The earth goes around the sun.|The earth moves around the sun."],
["蒂姆每天早上洗澡。","Tim has a shower every morning.|Tim takes a shower every morning."]]],
[6,"I don't ...（一般现在时的否定式）","don't/doesn't + 动词原形。He doesn't like（不是 doesn't likes）。",[
["我喝咖啡，但不喝茶。","I drink coffee, but I don't drink tea."],
["他不喜欢他的工作。","He doesn't like his job."],
["这里不常下雨。","It doesn't rain very often here.|It doesn't often rain here.|It doesn't rain here very often."],
["我们不太常看电视。","We don't watch television very often.|We don't often watch television."],
["萨拉说西班牙语，但不说意大利语。","Sarah speaks Spanish, but she doesn't speak Italian."],
["我的车不怎么耗油。","My car doesn't use much petrol.|My car doesn't use much gas."]]],
[7,"Do you ...?（一般现在时的疑问式）","Do/Does + 主语 + 动词原形？What does this word mean?",[
["你周日工作吗？","Do you work on Sundays?|Do you work on Sunday?"],
["你父母住在哪里？","Where do your parents live?"],
["这个词是什么意思？","What does this word mean?"],
["你多久洗一次头？","How often do you wash your hair?"],
["你是做什么工作的？","What do you do?|What's your job?"],
["你哥哥说英语吗？","Does your brother speak English?"]]],
[8,"I am doing 与 I do 比较","现在进行时 = 此刻正在做；一般现在时 = 习惯/事实。like/want/know/understand/mean 等不用进行时。",[
["杰克现在在看电视，他没在弹吉他。","Jack is watching television now. He isn't playing the guitar.|Jack is watching television now. He's not playing the guitar."],
["我每天早上八点开始工作。","I start work at 8 o'clock every morning."],
["你周末通常做什么？","What do you usually do at weekends?|What do you usually do at the weekend?|What do you usually do on weekends?"],
["我不明白。你是什么意思？","I don't understand. What do you mean?"],
["我累了，我想回家。","I'm tired. I want to go home."],
["听！有人在唱歌。","Listen! Somebody is singing.|Listen! Someone is singing."]]],
[9,"I have ... / I've got ...","have = have got（英式常用）。否定：haven't got / don't have；疑问：Have you got...? / Do you have...?",[
["我有一辆摩托车，但没有汽车。","I've got a motorbike, but I haven't got a car.|I have a motorbike, but I don't have a car."],
["蒂姆有两个姐妹。","Tim has two sisters.|Tim has got two sisters."],
["你有相机吗？","Have you got a camera?|Do you have a camera?"],
["这房子不错，但没有花园。","It's a nice house, but it hasn't got a garden.|It's a nice house, but it doesn't have a garden."],
["萨拉不舒服，她头疼。","Sarah isn't feeling well. She has a headache.|Sarah isn't feeling well. She's got a headache.|Sarah doesn't feel well. She has a headache."],
["他们没有孩子。","They haven't got any children.|They don't have any children.|They have no children."]]],
[10,"was/were","am/is → was，are → were。疑问把 was/were 提前。",[
["昨晚我很累。","I was tired last night."],
["你今天早上为什么迟到？","Why were you late this morning?"],
["旅行之后我们很饿，但不累。","We were hungry after the journey, but we weren't tired.|We were hungry after the trip, but we weren't tired."],
["你度假时天气好吗？","Was the weather nice when you were on holiday?|Was the weather good when you were on holiday?"],
["我小时候怕狗。","When I was a child, I was afraid of dogs.|I was afraid of dogs when I was a child."],
["昨天下午三点你在哪儿？","Where were you at three o'clock yesterday afternoon?|Where were you at 3 o'clock yesterday afternoon?"]]],
[11,"worked/got/went 等（一般过去时）","规则动词加 -ed；不规则动词要背：go→went, get→got, take→took…",[
["今天早上我九点起床。","I got up at nine o'clock this morning.|This morning I got up at nine o'clock."],
["昨天整个上午都在下雨。","It rained all morning yesterday.|Yesterday it rained all morning."],
["我们昨晚在聚会上跳了很多舞。","We danced a lot at the party last night."],
["卡罗琳上周去了三次电影院。","Caroline went to the cinema three times last week."],
["他走进房间，脱下外套，坐了下来。","He came into the room, took off his coat and sat down.|He came into the room, took his coat off and sat down."],
["我们昨天做了很多工作。","We did a lot of work yesterday."]]],
[12,"I didn't ... Did you ...?","didn't / Did ...? + 动词原形（不是 didn't went）。",[
["我昨天没看电视。","I didn't watch television yesterday."],
["你昨晚做了什么？","What did you do last night?"],
["事故是怎么发生的？","How did the accident happen?"],
["我们去看了电影，但不喜欢那部片子。","We went to the cinema, but we didn't enjoy the film.|We went to the cinema, but we didn't like the film."],
["你周日见到乔了吗？","Did you see Joe on Sunday?"],
["她没有时间，所以没去购物。","She didn't have time, so she didn't go shopping.|She didn't have time, so she didn't do the shopping."]]],

<script>

function merge(a,b){
  const o=fresh();o.ts=Math.max(a.ts||0,b.ts||0);
  o.unlockAll=((a.ts||0)>=(b.ts||0)?a:b).unlockAll||false;
  new Set([...Object.keys(a.units||{}),...Object.keys(b.units||{})]).forEach(n=>{
    const x=(a.units||{})[n]||{},y=(b.units||{})[n]||{};
    o.units[n]={attempts:Math.max(x.attempts||0,y.attempts||0),best:Math.max(x.best||0,y.best||0),
      last:((x.attempts||0)>=(y.attempts||0)?x.last:y.last)||0,mastered:!!(x.mastered||y.mastered)}});
  new Set([...Object.keys(a.items||{}),...Object.keys(b.items||{})]).forEach(k=>{
    const x=(a.items||{})[k],y=(b.items||{})[k];o.items[k]=!x?y:!y?x:((x.t||0)>=(y.t||0)?x:y)});
  const seen=new Set();o.log=[...(a.log||[]),...(b.log||[])].filter(l=>{const id=l.t+"-"+l.u;if(seen.has(id))return false;seen.add(id);return true}).sort((p,q)=>p.t-q.t).slice(-500);
  return o;
}
const canSync=()=>FB&&USER&&USER.emailVerified;
async function freshToken(){try{const r=await USER.getIdTokenResult();if(!r.claims.email_verified)await USER.getIdToken(true)}catch(e){}}
async function withAuth(fn){await freshToken();try{return await fn()}catch(e){if(e&&e.code==="permission-denied"){await USER.getIdToken(true);return await fn()}throw e}}
function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej({code:"timeout"}),ms)})]).finally(()=>clearTimeout(t))}
const SYNC_MSG={"permission-denied":"没有权限，请检查数据库规则","unavailable":"网络不可用","timeout":"网络超时","not-found":"找不到数据库",
  "failed-precondition":"数据库还没建好","resource-exhausted":"今天的免费额度用完了，明天自动恢复","unauthenticated":"登录已过期，请退出后重新登录"};
let upBusy=false,upAgain=false,failCount=0,retryTimer=null;
function scheduleUpload(){if(!canSync())return;SYNC.state="busy";renderAcct();clearTimeout(upTimer);upTimer=setTimeout(upload,1200)}
async function upload(){
  clearTimeout(upTimer);upTimer=null;if(!canSync())return false;
  if(upBusy){upAgain=true;return new Promise(r=>{const w=setInterval(()=>{if(!upBusy){clearInterval(w);r(SYNC.state==="ok")}},200)})}
  upBusy=true;let ok=false;
  try{await withTimeout(withAuth(()=>db.collection("users").doc(USER.uid).set({data:JSON.stringify(S),updatedAt:S.ts||Date.now(),email:USER.email||""})),20000);
    SYNC={state:"ok",at:Date.now()};failCount=0;ok=true}
  catch(e){console.error(e);SYNC={state:"err",at:SYNC.at,code:(e&&e.code)||"unknown"};failCount++;
    clearTimeout(retryTimer);retryTimer=setTimeout(scheduleUpload,Math.min(300000,15000*2**(failCount-1)))}
  finally{upBusy=false;renderAcct();if(upAgain){upAgain=false;if(ok)ok=await upload()}}
  return ok;
}
let lastPull=0,pulling=false;
async function pull(){
  if(!canSync()||pulling)return;pulling=true;lastPull=Date.now();
  SYNC.state="busy";renderAcct();
  try{const d=await withTimeout(withAuth(()=>db.collection("users").doc(USER.uid).get()),20000);
    let remoteNorm=null;
    if(d.exists&&d.data().data){const r=Object.assign(fresh(),JSON.parse(d.data().data));remoteNorm=JSON.stringify(merge(fresh(),r));S=merge(S,r)}
    localSave();
    if(remoteNorm!==JSON.stringify(S))await upload();else{SYNC={state:"ok",at:Date.now()};renderAcct()}
    if(!SES)home(true);
  }catch(e){console.error(e);SYNC={state:"err",at:SYNC.at,code:(e&&e.code)||"unknown"};renderAcct()}
  finally{pulling=false}
}
function ago(t){if(!t)return"";const s=(Date.now()-t)/1000;if(s<60)return"刚刚";if(s<3600)return Math.floor(s/60)+" 分钟前";if(s<86400)return Math.floor(s/3600)+" 小时前";return Math.floor(s/86400)+" 天前"}
function renderAcct(){
  const el=document.getElementById("acct");if(!el)return;
  if(!FB){el.innerHTML=FBDOWN?`<span class="dot err"></span><span class="txt">暂时连不上同步服务（可能是网络问题），进度先存在这台设备上。</span><button id="acct-reload">刷新页面</button>`:`<span class="dot"></span><span class="txt muted">本机模式：云同步还没配置，进度只存在这台设备上</span>`;
    const rl=document.getElementById("acct-reload");if(rl)rl.onclick=()=>location.reload();return}
  if(!USER){el.innerHTML=`<span class="dot"></span><span class="txt">未登录 · 进度只存在这台设备上</span><button class="primary" id="acct-in">登录 / 注册</button>`;
    document.getElementById("acct-in").onclick=openLogin;return}
  if(!USER.emailVerified){
    el.innerHTML=`<span class="dot busy"></span><span class="txt">${esc(USER.email||"")} · 邮箱还没验证。请打开验证邮件里的链接（也可能在垃圾邮件里），然后点“我已验证”。验证前进度只存在这台设备上。</span><button class="primary" id="acct-chk">我已验证</button><button id="acct-resend">重新发送</button><button class="ghost" id="acct-out">退出登录</button>`;
    document.getElementById("acct-chk").onclick=()=>checkVerified(true);
    document.getElementById("acct-resend").onclick=()=>sendVerify().then(()=>toast("验证邮件已重新发送")).catch(e=>toast(AUTH_ERR[e.code]||"发送失败："+(e.code||e.message)));
    document.getElementById("acct-out").onclick=logout;return}
  const st=SYNC.state==="busy"?"同步中…":SYNC.state==="err"?`同步失败：${esc(SYNC_MSG[SYNC.code]||"未知错误")}（${esc(String(SYNC.code))}）`:"已同步 "+ago(SYNC.at);
  el.innerHTML=`<span class="dot ${SYNC.state}"></span><span class="txt">${esc(USER.email||"")} · ${st}</span>${SYNC.state==="err"?'<button id="acct-retry">重试</button>':""}<button class="ghost" id="acct-out">退出登录</button>`;
  const rb=document.getElementById("acct-retry");if(rb)rb.onclick=()=>{failCount=0;lastPull=0;pull()};
  document.getElementById("acct-out").onclick=logout;
}
function sendVerify(){
  const u=auth.currentUser;if(!u)return Promise.resolve();
  const url=location.href.split("#")[0];
  return u.sendEmailVerification({url}).catch(()=>u.sendEmailVerification());
}
async function checkVerified(manual){
  const u=auth.currentUser;if(!u)return;
  try{await u.reload();USER=auth.currentUser;
    if(USER.emailVerified){await USER.getIdToken(true);toast("邮箱验证成功，开始同步进度");renderAcct();pull()}
    else{renderAcct();if(manual)toast("还没检测到验证。请先点邮件里的链接，再回来点“我已验证”")}
  }catch(e){if(manual)toast(AUTH_ERR[e.code]||"检查失败，请稍后再试")}
}
async function logout(){
  const btn=document.getElementById("acct-out");if(btn){btn.disabled=true;btn.textContent="正在保存…"}
  const synced=canSync();
  if(synced&&(upTimer||upBusy||SYNC.state!=="ok")){
    const ok=await upload();
    if(!ok){renderAcct();toast("还有进度没同步成功。为了不丢数据，暂时不能退出，请联网后点“重试”");return}
  }
  try{await auth.signOut()}catch(e){renderAcct();toast("退出失败，请检查网络后再试");return}
  if(synced){S=fresh();try{localStorage.removeItem(KEY)}catch(e){}home();toast("已退出。进度保存在云端，下次登录会自动恢复")}
  else{home();toast("已退出。本机进度保留，验证邮箱并登录后会自动上传")}
}

/* ---------- answer matching ---------- */
const SPELL={colour:"color",colours:"colors",favourite:"favorite",favourites:"favorites",centre:"center",theatre:"theater",travelling:"traveling",travelled:"traveled",programme:"program",kilometres:"kilometers",kilometre:"kilometer",maths:"math",learnt:"learned",tv:"television",okay:"ok",aeroplane:"airplane",mr:"mr",realise:"realize"};
const NUM={two:"2",three:"3",four:"4",five:"5",six:"6",seven:"7",eight:"8",nine:"9",ten:"10",eleven:"11",twelve:"12",twenty:"20",thirty:"30",fifty:"50",eighteen:"18",fifteen:"15"};
const S_WORDS=new Set(["it","he","she","that","there","what","where","who","here","how","everything","everybody","nobody","nothing","something","somebody","someone","this"]);
function baseNorm(s){
  s=s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”"«»]/g," ");
  s=s.replace(/(\d)[.:](\d)/g,"$1h$2");
  s=s.replace(/\b(a|one) hundred\b/g,"100").replace(/\bfour hundred\b/g,"400").replace(/\bfive hundred\b/g,"500");
  s=s.replace(/\bno[- ]one\b/g,"noone").replace(/\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not").replace(/\bshan't\b/g,"shall not").replace(/\bcan't\b/g,"can not");
  s=s.replace(/n't\b/g," not").replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'m\b/g," am").replace(/'ll\b/g," will");
  s=s.replace(/[—–-]/g," ").replace(/[.,!?;:()…]/g," ");
  return s.split(/\s+/).filter(Boolean).map(w=>SPELL[w]||NUM[w]||w);
}
function variants(s){
  let out=[[]];
  for(const w of baseNorm(s)){
    let opts=[w];
    let m=w.match(/^(\w+)'s$/); if(m&&S_WORDS.has(m[1]))opts=[m[1]+" is",m[1]+" has"];
    m=w.match(/^(\w+)'d$/); if(m)opts=[m[1]+" would",m[1]+" had"];
    if(opts.length>1&&out.length<16){const nx=[];for(const o of out)for(const p of opts)nx.push(o.concat(p.split(" ")));out=nx}
    else out=out.map(o=>o.concat(opts[0].split(" ")));
  }
  return out.map(a=>a.join(" "));
}
function isMatch(ans,refs){const a=new Set(variants(ans));return refs.some(r=>variants(r).some(v=>a.has(v)))}
function tokens(s){return s.replace(/[“”"]/g,"").trim().split(/\s+/).filter(Boolean)}
const tnorm=w=>{const b=baseNorm(w);return b.join(" ")};
function lcs(a,b){const A=a.map(tnorm),B=b.map(tnorm);const m=A.length,n=B.length;const d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=A[i]===B[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const ua=new Array(m).fill(false),ub=new Array(n).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(A[i]===B[j]){ua[i]=ub[j]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  return {len:d[0][0],ua,ub}}
function closest(ans,refs){const a=tokens(ans);let best=null;
  refs.forEach(r=>{const b=tokens(r);const x=lcs(a,b);const sc=x.len/Math.max(a.length,b.length,1);if(!best||sc>best.sc)best={sc,r,a,b,x}});return best}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function markLine(toks,used,cls){return toks.map((t,i)=>used[i]?esc(t):`<span class="${cls}">${esc(t)}</span>`).join(" ")}

/* ---------- views ---------- */
const app=document.getElementById("app");
let SES=null;

function home(keepScroll){
  SES=null;document.onkeydown=null;
  const cur=currentUnit();
  const mastered=Object.values(S.units).filter(u=>u.mastered).length;
  const due=dueKeys(null).length;
  const done=Object.keys(S.items).length;
  let nextHtml;
  if(cur){const u=BY[cur],st=uState(cur);
    nextHtml=`<div class="next">
      <div class="unit-no">UNIT ${cur}${st.attempts?` · 已练 ${st.attempts} 轮，最好 ${Math.round(st.best*100)}%`:""}</div>
      <h2>${esc(u.t)}</h2>
      <div class="tip">${esc(u.tip)}</div>
      <div class="row"><button class="primary" id="go">开始练习 Unit ${cur}</button>
      <button id="rev" ${due?"":"disabled"}>复习到期的句子（${due}）</button></div>
      <div class="kbd">本轮 6 句本单元 + 最多 3 句到期复习。本单元得分 ≥ 80% 即解锁下一单元。</div>
    </div>`}
  else nextHtml=`<div class="next"><h2>115 个单元全部掌握</h2><div class="tip">继续用复习保持手感。</div><div class="row"><button class="primary" id="rev" ${due?"":"disabled"}>复习（${due}）</button></div></div>`;

  const secs=SECTIONS.map(([a,b,name])=>{
    let cells="",m=0;
    for(let n=a;n<=b;n++){const st=uState(n);const lk=!unlocked(n);if(st.mastered)m++;
      const cls=n===cur?"cur":st.mastered?"done":lk?"locked":st.attempts?"tried":"";
      const t=`Unit ${n} ${BY[n].t}${st.attempts?` · 最好 ${Math.round(st.best*100)}%`:""}`;
      cells+=`<button class="cell ${cls}" data-u="${n}" title="${esc(t)}" aria-label="${esc(t)}">${n}</button>`}
    return `<div class="sec"><div class="label"><span>${esc(name)}</span><span class="mono">${m}/${b-a+1}</span></div><div class="cells">${cells}</div></div>`}).join("");

  app.innerHTML=`
  <div class="top"><div><h1>剑桥语法中译英</h1><div class="sub">Essential Grammar in Use · 按掌握度逐单元推进</div></div>
    <div class="stats"><div class="stat"><b>${mastered}<span class="muted" style="font-size:14px">/115</span></b><span>已掌握单元</span></div>
    <div class="stat"><b>${due}</b><span>待复习</span></div><div class="stat"><b>${done}</b><span>练过的句子</span></div></div></div>
  <div class="acct" id="acct"></div>
  ${nextHtml}
  <div class="map">
    <div class="legend"><span><i style="background:var(--ok);border-color:var(--ok)"></i>已掌握</span><span><i style="background:var(--accent-soft);border:2px solid var(--accent)"></i>当前</span><span><i style="background:var(--mid-soft);border-color:var(--mid)"></i>练过未过关</span><span><i style="background:var(--surface)"></i>可练</span><span><i style="background:var(--cell-locked);border-style:dashed"></i>未解锁</span></div>
    ${secs}
  </div>
  <div class="tools">
    <button id="exp-wrong">导出错题给 AI（Markdown）</button>
    <button id="backup">备份进度</button>
    <button id="restore">恢复进度</button>
    <label class="switch"><input type="checkbox" id="unlock" ${S.unlockAll?"checked":""}> 解锁全部单元</label>
  </div>`;
  const g=document.getElementById("go");if(g)g.onclick=()=>startUnit(cur);
  const r=document.getElementById("rev");if(r)r.onclick=startReview;
  app.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const n=+c.dataset.u;if(!unlocked(n)){toast(`先在 Unit ${n-1} 达到 80% 才能解锁`);return}startUnit(n)});
  document.getElementById("exp-wrong").onclick=exportWrong;
  document.getElementById("backup").onclick=()=>openSheet("备份进度","复制这段代码保存到备忘录。换设备或清除了浏览器数据时，用“恢复进度”粘贴回来。",JSON.stringify(S),false);
  document.getElementById("restore").onclick=()=>openSheet("恢复进度","把之前备份的代码粘贴到下面，然后点“恢复进度”。备份会和当前进度合并：每句保留最新的记录，过关过的单元保持过关。","",true);
  document.getElementById("unlock").onchange=e=>{S.unlockAll=e.target.checked;save();home()};
  renderAcct();
  if(!keepScroll)window.scrollTo(0,0);
}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startUnit(n){
  const own=shuffle(BY[n].s.map((_,i)=>keyOf(n,i)));
  const rev=dueKeys(n).slice(0,3);
  const q=own.slice();[1,4,7].forEach((p,i)=>{if(rev[i])q.splice(Math.min(p,q.length),0,rev[i])});
  SES={mode:"unit",unit:n,queue:q,idx:0,results:[]};practice();
}
function startReview(){
  let q=dueKeys(null).slice(0,12);
  if(!q.length){toast("现在没有到期的复习");return}
  SES={mode:"review",unit:null,queue:shuffle(q),idx:0,results:[]};practice();
}

function practice(){
  const k=SES.queue[SES.idx];const [u,i]=parseKey(k);const unit=BY[u];const item=unit.s[i];
  const isRev=SES.mode==="unit"&&u!==SES.unit||SES.mode==="review";
  app.innerHTML=`
  <div class="bar"><button class="ghost" id="quit">退出</button><div class="progress"><div style="width:${SES.idx/SES.queue.length*100}%"></div></div><span class="mono muted">${SES.idx+1}/${SES.queue.length}</span></div>
  <div class="card">
    <div class="tag"><span class="chip ${isRev?"review":""}">${isRev?"复习":"新练"} · Unit ${u}</span><span>${esc(unit.t)}</span></div>
    <div class="zh">${esc(item.zh)}</div>
    <div class="row"><button class="ghost" id="hintbtn" style="min-height:36px;padding:4px 12px;font-size:14px">语法提示</button></div>
    <div class="hint" id="hint" hidden>${esc(unit.tip)}</div>
    <textarea id="ans" rows="3" maxlength="300" placeholder="Type the English sentence…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="row"><button class="primary" id="check">检查</button><span class="kbd">回车检查 · Shift+回车换行</span></div>
    <div id="fb"></div>
  </div>`;
  const ta=document.getElementById("ans");ta.focus();
  document.getElementById("quit").onclick=()=>{if(SES.results.length)finish();else home()};
  document.getElementById("hintbtn").onclick=()=>{const h=document.getElementById("hint");h.hidden=!h.hidden};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();check()}};
  document.getElementById("check").onclick=check;

  let checked=false;
  function check(){
    if(checked)return;
    const ans=ta.value.trim();if(!ans){ta.focus();return}
    checked=true;
    ta.readOnly=true;document.getElementById("check").hidden=true;
    const fb=document.getElementById("fb");
    const ok=isMatch(ans,item.refs);
    const c=closest(ans,item.refs);
    const others=item.refs.filter(r=>r!==c.r);
    const altHtml=others.length?`<div class="alts">也可以：${others.map(r=>`<div class="en">${esc(r)}</div>`).join("")}</div>`:"";
    if(ok){
      fb.innerHTML=`<div class="fb"><div class="verdict ok">完全正确</div>
        <div class="lines"><div class="ln"><span class="k">参考</span><span class="en">${esc(c.r)}</span></div></div>${altHtml}
        <div class="row"><button class="primary" id="next">下一题</button><span class="kbd">回车继续</span></div></div>`;
      record(k,ans,1,true);
      const nx=document.getElementById("next");nx.focus({preventScroll:true});nx.scrollIntoView({block:"nearest",behavior:"smooth"});
    }else{
      fb.innerHTML=`<div class="fb"><div class="verdict check">和参考答案对比一下，再给自己打分</div>
        <div class="lines">
          <div class="ln"><span class="k">你的</span><span class="en">${markLine(c.a,c.x.ua,"extra")}</span></div>
          <div class="ln"><span class="k">参考</span><span class="en">${markLine(c.b,c.x.ub,"miss")}</span></div>
        </div>${altHtml}
        <div class="kbd">红色划线 = 参考答案里没有的词；绿色 = 你漏掉或写法不同的词。同义改写算对。</div>
        <div class="grade" id="grade"><button class="g1" data-g="1">对（1）</button><button class="g2" data-g="0.5">部分对（2）</button><button class="g0" data-g="0">错（3）</button></div></div>`;
      let graded=false;const grade=g=>{if(graded)return;graded=true;record(k,ans,g,false);advance()};
      fb.querySelectorAll(".grade button").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
      const box=fb.querySelector(".fb");box.tabIndex=-1;box.focus({preventScroll:true});
      document.getElementById("grade").scrollIntoView({block:"nearest",behavior:"smooth"});
      document.onkeydown=e=>{if(e.isComposing)return;if(["1","2","3"].includes(e.key)){e.preventDefault();grade([1,0.5,0][+e.key-1])}};
      return;
    }
    let moved=false;const go=()=>{if(moved)return;moved=true;advance()};
    document.getElementById("next").onclick=go;
    document.onkeydown=e=>{if(e.isComposing)return;if(e.key==="Enter"){e.preventDefault();go()}};
  }
}
function record(k,ans,g,auto){
  const now=Date.now();const it=S.items[k]||{box:0,due:now,right:0,wrong:0};
  if(g===1){it.box=Math.min(it.box+1,INTERVALS.length-1);it.due=now+INTERVALS[it.box]*DAY;it.right++}
  else if(g===0.5){it.box=Math.max(0,it.box-1);it.due=now+DAY/2;it.wrong++}
  else{it.box=0;it.due=now;it.wrong++}
  it.last=String(ans).slice(0,300);it.lastGrade=g;it.t=now;S.items[k]=it;
  SES.results.push({k,ans,g,auto});save();
}
function advance(){document.onkeydown=null;SES.idx++;if(SES.idx>=SES.queue.length)finish();else practice()}

function finish(){
  document.onkeydown=null;
  let banner="",scoreHtml="",nextBtn="";
  if(SES.mode==="unit"){
    const n=SES.unit;const own=SES.results.filter(r=>parseKey(r.k)[0]===n);
    const pts=own.reduce((s,r)=>s+r.g,0);const total=BY[n].s.length;
    const complete=own.length===total;
    const st=Object.assign({attempts:0,best:0,last:0,mastered:false},S.units[n]);
    if(complete){const sc=pts/total;st.attempts++;st.last=sc;st.best=Math.max(st.best,sc);
      const was=st.mastered;if(sc>=PASS)st.mastered=true;S.units[n]=st;S.log.push({t:Date.now(),u:n,sc});if(S.log.length>500)S.log=S.log.slice(-500);save();
      scoreHtml=`<div class="score">${fmt(pts)}<span class="muted" style="font-size:22px"> / ${total}</span></div>`;
      if(sc>=PASS){banner=`<div class="banner ok">Unit ${n} 过关${was?"（已掌握单元的复练）":""}。${n<N?`Unit ${n+1} 已解锁。`:""}</div>`;
        const nx=currentUnit();if(nx)nextBtn=`<button class="primary" id="nextu">继续 Unit ${nx}</button>`}
      else{banner=`<div class="banner mid">得分 ${Math.round(sc*100)}%，还差一点（需要 80%）。先把下面的错句看懂，再练一轮。</div>`;
        nextBtn=`<button class="primary" id="again">再练 Unit ${n}</button>`}
    }else{banner=`<div class="banner mid">本轮中途退出，不计入过关判定。已练的句子会进入复习。</div>`;nextBtn=`<button class="primary" id="again">重新练 Unit ${n}</button>`}
  }else{
    const pts=SES.results.reduce((s,r)=>s+r.g,0);
    scoreHtml=`<div class="score">${fmt(pts)}<span class="muted" style="font-size:22px"> / ${SES.results.length}</span></div>`;
    banner=`<div class="banner ok">复习完成。答错的句子会很快再次出现。</div>`;
  }
  const list=SES.results.map(r=>{const [u,i]=parseKey(r.k);const it=BY[u].s[i];
    return `<div class="res-item"><div class="row" style="gap:8px"><span class="pill g${r.g===1?1:r.g===0.5?2:0}">${r.g===1?"对":r.g===0.5?"部分对":"错"}</span><span class="mono muted" style="font-size:12px">Unit ${u}</span></div>
      <div class="zhs">${esc(it.zh)}</div>
      ${r.g===1&&r.auto?"":`<div class="en">${esc(r.ans)}</div>`}
      <div class="en muted">${esc(it.refs[0])}</div></div>`}).join("");
  app.innerHTML=`
    <div class="card">
      <div class="label">${SES.mode==="unit"?`UNIT ${SES.unit} · ${esc(BY[SES.unit].t)}`:"复习"}</div>
      ${scoreHtml}${banner}
      <div class="row">${nextBtn}<button id="ai">复制本轮给 AI 批改</button><button class="ghost" id="back">回首页</button></div>
    </div>
    <div class="card"><h3 style="font-size:16px">本轮句子</h3><div class="res">${list}</div></div>`;
  const nu=document.getElementById("nextu");if(nu)nu.onclick=()=>startUnit(currentUnit());
  const ag=document.getElementById("again");if(ag)ag.onclick=()=>startUnit(SES.unit);
  document.getElementById("back").onclick=()=>home();
  const res=SES.results;
  document.getElementById("ai").onclick=()=>openSheet("复制给 AI 批改","粘贴到 Claude 或其他 AI，让它逐句批改。",buildMd(res.map(r=>({k:r.k,ans:r.ans,g:r.g,auto:r.auto})),"本轮练习"),false);
  window.scrollTo(0,0);
}
const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(1);
const GL={1:"对",0.5:"部分对",0:"错"};

function buildMd(rows,label){
  const head=`# 中译英批改请求（${label}）

我在用《剑桥初级英语语法》（Essential Grammar in Use）练习中译英，准备以后考雅思。请你作为英语老师，逐句批改下面我的翻译：

1. 判断我的句子在语法和用词上是否正确（意思对、和参考答案不同的说法也算对）。
2. 如果有错，指出错在哪里，并用中文简单解释涉及的语法点（尽量对应书中的 Unit）。
3. 给出一个更自然的说法。
4. 最后总结我最常犯的 2–3 类错误，并各给 2 个新的中译英练习句（附答案）。

`;
  const body=rows.map((r,idx)=>{const [u,i]=parseKey(r.k);const it=BY[u].s[i];
    return `## ${idx+1}. Unit ${u} · ${BY[u].t}
- 中文：${it.zh}
- 我的翻译：${r.ans||"（没有记录）"}
- 参考答案：${it.refs.join(" / ")}
- 我的自评：${GL[r.g]??"—"}${r.auto?"（与参考答案完全一致）":""}`}).join("\n\n");
  return head+body+"\n";
}
function exportWrong(){
  const rows=Object.entries(S.items).filter(([k,v])=>v.lastGrade!==1||v.box<2&&v.wrong>0)
    .sort((a,b)=>parseKey(a[0])[0]-parseKey(b[0])[0]).slice(0,40)
    .map(([k,v])=>({k,ans:v.last,g:v.lastGrade,auto:false}));
  if(!rows.length){toast("还没有错题，先练一轮吧");return}
  openSheet("导出错题给 AI",`共 ${rows.length} 句（最近一次答错或部分对、或刚开始记的句子，最多 40 句）。`,buildMd(rows,"错题集"),false);
}

/* ---------- sheet & toast ---------- */
const sheet=document.getElementById("sheet"),stext=document.getElementById("sheet-text");
function openSheet(title,desc,text,isRestore){
  document.getElementById("sheet-title").textContent=title;document.getElementById("sheet-desc").textContent=desc;
  stext.value=text;stext.readOnly=!isRestore;stext.placeholder=isRestore?"在这里粘贴备份代码":"";
  document.getElementById("sheet-copy").hidden=isRestore;document.getElementById("sheet-apply").hidden=!isRestore;
  sheet.hidden=false;if(isRestore)stext.focus();
}
document.getElementById("sheet-close").onclick=()=>{sheet.hidden=true};
sheet.onclick=e=>{if(e.target===sheet)sheet.hidden=true};
document.getElementById("sheet-copy").onclick=()=>{
  const fallback=()=>{stext.focus();stext.select();toast("已选中全部文字，请手动复制")};
  try{navigator.clipboard.writeText(stext.value).then(()=>toast("已复制，去粘贴给 AI 吧"),fallback)}catch(e){fallback()}
};
document.getElementById("sheet-apply").onclick=()=>{
  try{const o=JSON.parse(stext.value);if(!o||typeof o!=="object"||!o.units)throw 0;S=merge(S,Object.assign(fresh(),o));save();sheet.hidden=true;toast("进度已恢复");home()}
  catch(e){toast("这段代码无法识别，请粘贴完整的备份代码")}
};
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2400)}

home();
if(FB)auth.onAuthStateChanged(u=>{USER=u;if(u)closeLogin();renderAcct();if(u&&u.emailVerified){lastPull=0;pull()}});
</script>
